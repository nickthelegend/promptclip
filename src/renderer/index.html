<!doctype html><html><head><meta charset="UTF-8"><title>PromptClip</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="brand.css"></head><body><main><header><div class="brand"><img src="../assets/promptclip-icon.png" alt=""><div><strong>PromptClip</strong><span>⌘⇧Space to toggle</span></div></div><div class="actions"><button id="import" title="Import Apple Notes" aria-label="Import Apple Notes">↓</button><button id="add" title="New prompt" aria-label="New prompt">+</button></div></header><input id="search" type="search" autocomplete="off" aria-label="Search prompts" placeholder="Search prompts…"><section id="list" aria-live="polite"></section><form id="editor" hidden><input id="title" placeholder="Prompt title" required><textarea id="body" placeholder="Write the prompt…" required></textarea><div><button type="button" id="cancel">Cancel</button><button type="submit">Save prompt</button></div></form><p id="status"></p></main><script src="renderer.js"></script></body></html>
